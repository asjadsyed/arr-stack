services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:10.11.4@sha256:234ea8d508b2cba26054d0dac9d4c0353435dce483e8b266947d473629774559
    container_name: jellyfin
    hostname: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/New_York
      # Optional - alternative address used for autodiscovery
      # - JELLYFIN_PublishedServerUrl=http://example.com
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_EXTERNAL_URL:-}
    ports:
      - 8096:8096/tcp # HTTP
      - 8920:8920/tcp # HTTPS
      - 7359:7359/udp
      - 1900:1900/udp
    volumes:
      - ${ROOT_DIR_OVERRIDE:-./root}/config/jellyfin-config:/config
      - ${ROOT_DIR_OVERRIDE:-./root}/cache/jellyfin-cache:/cache
      - ${ROOT_DIR_OVERRIDE:-./root}/data:/data
    restart: "unless-stopped"
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:8096/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 6s
      retries: 5
      start_period: 45s

  jellyseerr:
    image: fallenbagel/jellyseerr:2.7.3@sha256:4538137bc5af902dece165f2bf73776d9cf4eafb6dd714670724af8f3eb77764
    container_name: jellyseerr
    environment:
      - TZ=America/New_York
    ports:
      - 5055:5055
    volumes:
      - ${ROOT_DIR_OVERRIDE:-./root}/config/jellyseerr-config:/app/config
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:6.0.4@sha256:06ac318ecb95a34c7b229568dcb4271f02cb5007bb189a0dd67a2032864187ca
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/New_York
    ports:
      - 7878:7878
    volumes:
      - ${ROOT_DIR_OVERRIDE:-./root}/config/radarr-config:/config
      # You are using docker; download client qBittorrent places downloads in /data/torrents but this directory does not appear to exist inside the container. Review your remote path mappings and container volume settings.
      - ${ROOT_DIR_OVERRIDE:-./root}/data:/data
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.16@sha256:60e5edcac39172294ad22d55d1b08c2c0a9fe658cad2f2c4d742ae017d7874de
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/New_York
    ports:
      - 8989:8989
    volumes:
      - ${ROOT_DIR_OVERRIDE:-./root}/config/sonarr-config:/config
      - ${ROOT_DIR_OVERRIDE:-./root}/data:/data
      - ${ROOT_DIR_OVERRIDE:-./root}/opt/sonarr:/opt/sonarr
    restart: unless-stopped

  # lidarr:
  #  image: lscr.io/linuxserver/lidarr:3.1.0.4875@sha256:dbffcf91da47d48e09e613857032c95a62755b928a71a7718688e3ab03fbbd26
  #  container_name: lidarr
  #  environment:
  #    - PUID=1000
  #    - PGID=1000
  #    - TZ=America/New_York
  #  ports:
  #    - 8686:8686
  #  volumes:
  #    - ${ROOT_DIR_OVERRIDE:-./root}/config/lidarr-config:/config
  #    - ${ROOT_DIR_OVERRIDE:-./root}/data:/data
  #  restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:version-2.3.0.5236@sha256:475853535de3de8441b87c1457c30f2e695f4831228b12b6b7274e9da409d874
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/New_York
    ports:
      - 9696:9696
    volumes:
      - ${ROOT_DIR_OVERRIDE:-./root}/config/prowlarr-config:/config
    restart: unless-stopped

  qbittorrent:
    build:
      context: .
      dockerfile: qbittorrent.Dockerfile
    container_name: qbittorrent
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=America/New_York
      - WEBUI_PORT=8080
      - TORRENTING_PORT=6881
      - QBITTORRENT_USERNAME=${QBITTORRENT_USERNAME}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}
    ports:
      - 8080:8080
      - 6881:6881
      - 6881:6881/udp
    volumes:
      - qbittorrent_config:/config
      - ${ROOT_DIR_OVERRIDE:-./root}/data:/data
    restart: unless-stopped

  init:
    # http://localhost:7878/settings/mediamanagement
    # http://localhost:8989/settings/mediamanagement
    build:
      context: .
      dockerfile: init.Dockerfile
    container_name: init
    depends_on:
      jellyfin: { condition: service_healthy }
      jellyseerr: { condition: service_started }
      radarr: { condition: service_started }
      sonarr: { condition: service_started }
      prowlarr: { condition: service_started }
      qbittorrent: { condition: service_started }
    volumes:
      - ${ROOT_DIR_OVERRIDE:-./root}/config/:/config/:ro
      - ${ROOT_DIR_OVERRIDE:-./root}/data:/data
      # - ${ROOT_DIR_OVERRIDE:-./root}/opt/init:/opt/init
      # - init:/opt/init
    restart: "no"
    env_file:
      - .env
    environment:
      - JELLYFIN_USERNAME=${JELLYFIN_USERNAME}
      - JELLYFIN_PASSWORD=${JELLYFIN_PASSWORD}
      - JELLYSEERR_EMAIL=${JELLYSEERR_EMAIL}
      - RADARR_USERNAME=${RADARR_USERNAME}
      - RADARR_PASSWORD=${RADARR_PASSWORD}
      - SONARR_USERNAME=${SONARR_USERNAME}
      - SONARR_PASSWORD=${SONARR_PASSWORD}
      - PROWLARR_USERNAME=${PROWLARR_USERNAME}
      - PROWLARR_PASSWORD=${PROWLARR_PASSWORD}
      - QBITTORRENT_USERNAME=${QBITTORRENT_USERNAME}
      - QBITTORRENT_PASSWORD=${QBITTORRENT_PASSWORD}
      - JELLYFIN_EXTERNAL_URL=${JELLYFIN_EXTERNAL_URL:-http://localhost:8096}
      - RADARR_EXTERNAL_URL=${RADARR_EXTERNAL_URL:-http://localhost:7878}
      - SONARR_EXTERNAL_URL=${SONARR_EXTERNAL_URL:-http://localhost:8989}

volumes:
  qbittorrent_config:
  # init:
